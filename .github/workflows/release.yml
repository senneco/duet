# После каждого обновления main собирает готовый duet под macOS и Linux и выкладывает его
# в выпуск latest: его скачивает install.sh, когда Go на машине нет.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/duet-$os-$arch" ./cmd/duet
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="duet ${GITHUB_SHA::7}"
          notes="Built from $GITHUB_SHA. Install: see INSTALL.md."
          if gh release view latest >/dev/null 2>&1; then
            git tag -f latest
            git push -f origin refs/tags/latest
            gh release upload latest dist/* --clobber
            gh release edit latest --title "$title" --notes "$notes"
          else
            gh release create latest dist/* --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
