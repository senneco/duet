name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go: ['1.25.x', stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
        env:
          GOTOOLCHAIN: local
      - run: node --test server/webtest/*.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Собрать выпуск
        env:
          VERSION: ${{ github.ref_name }}
          GOTOOLCHAIN: local
          CGO_ENABLED: 0
        run: bash scripts/package-release.sh "$VERSION"
      - name: Опубликовать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --draft --generate-notes
          fi
          if [ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --draft=false --latest
          fi
