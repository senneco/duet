<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duet — макет C · Как приложение macOS</title>
<style>
/* ───────────── Основа ───────────── */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,Georgia,serif;
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#ffffff; --side:#ededf0; --bar:#ffffff; --status:#f6f6f7;
  --hair:rgba(0,0,0,.11); --hair2:rgba(0,0,0,.06);
  --tx:#1d1d1f; --tx2:rgba(0,0,0,.55); --tx3:rgba(0,0,0,.32);
  --acc:#007aff; --acc-tx:#0a66d9; --acc-tint:rgba(0,122,255,.13); --acc-soft:rgba(0,122,255,.08);
  --green:#1f9d47; --orange:#c25e00; --red-tx:#c4352b;
  --del:#ffebe9; --delw:#ffc2bb; --add:#e6efff; --addw:#bcd4ff;
  --hatch:rgba(0,0,0,.075); --hatchbg:#fcfcfc;
  --plaque:rgba(0,0,0,.055); --plaque-b:rgba(0,0,0,.04);
  --stripe:#f5f5f7; --hover:rgba(0,0,0,.045);
  --btn:#ffffff; --btn-b:rgba(0,0,0,.14); --btn-sh:0 .5px 1.5px rgba(0,0,0,.12);
  --menu:#f6f6f6; --menu-b:rgba(0,0,0,.14);
  --pop-sh:0 0 0 .5px rgba(0,0,0,.16),0 10px 32px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);
  --scrim:rgba(0,0,0,.14);
  --fold:#f5f6f8;
  /* синтаксис — как Xcode, светлая */
  --s-kw:#9b2393; --s-str:#c41a16; --s-com:#5d6c79; --s-num:#1c00cf; --s-typ:#0b4f79; --s-fn:#326d74;
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#1e1e20; --side:#2a2a2d; --bar:#1e1e20; --status:#232326;
  --hair:rgba(255,255,255,.10); --hair2:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.88); --tx2:rgba(255,255,255,.55); --tx3:rgba(255,255,255,.30);
  --acc:#0a84ff; --acc-tx:#4ea2ff; --acc-tint:rgba(10,132,255,.24); --acc-soft:rgba(10,132,255,.12);
  --green:#32d15e; --orange:#ffa53a; --red-tx:#ff8b80;
  --del:#4a2228; --delw:#7a3540; --add:#263a50; --addw:#3d4f8a;
  --hatch:rgba(255,255,255,.075); --hatchbg:#1b1b1d;
  --plaque:rgba(255,255,255,.08); --plaque-b:rgba(255,255,255,.05);
  --stripe:#232326; --hover:rgba(255,255,255,.05);
  --btn:#3a3a3d; --btn-b:rgba(255,255,255,.10); --btn-sh:0 .5px 1px rgba(0,0,0,.4);
  --menu:#2c2c2f; --menu-b:rgba(255,255,255,.13);
  --pop-sh:0 0 0 .5px rgba(0,0,0,.8),0 12px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.30);
  --fold:#252528;
  /* синтаксис — как Xcode, тёмная */
  --s-kw:#fc5fa3; --s-str:#fc6a5d; --s-com:#7f8c98; --s-num:#d0bf69; --s-typ:#5dd8ff; --s-fn:#67b7a4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}

/* ───────────── Окно ───────────── */
.win{display:grid;grid-template-columns:268px 1fr;height:100vh;transition:filter .2s}
.win.solo{grid-template-columns:1fr}
.side{background:var(--side);border-right:.5px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}

/* боковая панель */
.side-top{height:52px;display:flex;align-items:center;gap:2px;padding:0 10px;flex:none}
.side-top .back{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 4px;border-radius:6px;color:var(--tx2);cursor:default;font-weight:500}
.side-top .back:hover,.tb-ic:hover{background:var(--hover)}
.tb-ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--tx2);cursor:default;border:0;background:none;padding:0}
.rev-head{padding:2px 16px 12px;flex:none}
.rev-title{font-size:13px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.rev-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--tx2)}
.prog{flex:1;height:3px;border-radius:2px;background:var(--hair);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);border-radius:2px}
.agent{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;color:var(--tx2)}
.agent b{font-weight:500;color:var(--tx)}
.tree{flex:1;overflow:auto;padding:4px 10px 10px;min-height:0}
.sect{font-size:11px;font-weight:600;color:var(--tx3);padding:10px 8px 4px;letter-spacing:.01em}
.row{display:flex;align-items:center;height:26px;border-radius:6px;padding-right:8px;gap:6px;cursor:default;white-space:nowrap}
.row:hover{background:var(--hover)}
.row.sel{background:var(--acc-tint)}
.row .disc{width:14px;height:14px;display:grid;place-items:center;color:var(--tx3);flex:none;transition:transform .15s}
.row .disc svg{width:10px;height:10px;stroke-width:2}
.dir.closed>.row .disc{transform:rotate(-90deg)}
.dir.closed>.kids{display:none}
.row .fic{color:var(--acc);display:grid;place-items:center;width:16px;flex:none}
.row .st{width:16px;height:16px;display:grid;place-items:center;flex:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .acc{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx3)}
.row.gone .nm{color:var(--tx3)}
.row.note .nm{font-weight:500}
.blocks{margin:1px 0 4px}
.blocks.closed{display:none}
.blk-row{display:flex;align-items:center;gap:8px;height:24px;border-radius:6px;font-size:12px;color:var(--tx2);cursor:default}
.blk-row:hover{background:var(--hover);color:var(--tx)}
.blk-row .imp{width:16px;display:grid;place-items:center;flex:none}
.blk-row .imp svg{width:12px;height:12px;stroke-width:1.7}
.imp.i3 svg{stroke-width:2}
.imp.i3{color:var(--acc-tx);font-weight:700}.imp.i2{color:var(--tx2)}.imp.i1{color:var(--tx3)}
.side-foot{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:.5px solid var(--hair)}

/* значки состояния */
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dot.blink{animation:blink 1.6s ease-in-out infinite}
.ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--acc)}
.chk{color:var(--green)}
.chk svg{width:13px;height:13px;stroke-width:2.1}
.gone-ic{width:8px;height:1.5px;background:var(--tx3);border-radius:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}
.dots{display:inline-flex;gap:2.5px;align-items:center;height:10px}
.dots i{width:3.5px;height:3.5px;border-radius:50%;background:var(--acc);animation:hop 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}
.ripple{position:relative;flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);margin:0 4px}
.ripple::before,.ripple::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.2px solid var(--acc);animation:rip 2.2s ease-out infinite}
.ripple::after{animation-delay:1.1s}
@keyframes rip{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.7);opacity:0}}
.disk{color:var(--orange);font-size:11px;display:flex;align-items:center;gap:3px}

/* сегменты в углу: тема и язык */
.seg{display:inline-flex;background:var(--plaque);border-radius:6px;padding:1px;gap:1px}
.seg button{border:0;background:none;height:20px;min-width:24px;padding:0 5px;border-radius:5px;display:grid;place-items:center;color:var(--tx2);font-size:11px;font-weight:500;cursor:default}
.seg button svg{width:13px;height:13px}
.seg button.on{background:var(--btn);color:var(--tx);box-shadow:var(--btn-sh)}

/* панель инструментов */
.tb{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;background:var(--bar);border-bottom:.5px solid var(--hair);position:relative}
.ttl{min-width:0;display:flex;flex-direction:column;gap:1px}
.ttl .path{font:12.5px var(--mono);color:var(--tx2);white-space:nowrap}
.ttl .path b{color:var(--tx);font-weight:600}
.ttl .big{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ttl .sub{font-size:11px;color:var(--tx2);white-space:nowrap}
.ttl .sub .sep{margin:0 5px;color:var(--tx3)}
.tb .grow{flex:1}
.btn{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;background:var(--btn);border:.5px solid var(--btn-b);box-shadow:var(--btn-sh);font-size:12.5px;font-weight:500;cursor:default;white-space:nowrap}
.btn .k{font:11px var(--mono);color:var(--tx3);margin-left:2px}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent;box-shadow:0 .5px 1.5px rgba(0,0,0,.2)}
.btn.pri .k{color:rgba(255,255,255,.72)}
.btn.pri svg{stroke-width:2}
.btn.icon{padding:0 6px}
.btn.pressed{background:var(--plaque);box-shadow:none}
.nav{display:inline-flex;align-items:center;gap:8px;color:var(--tx2);font-size:11.5px}
.nav .grp{display:inline-flex;border-radius:6px;background:var(--btn);border:.5px solid var(--btn-b);box-shadow:var(--btn-sh);height:24px}
.nav .grp button{border:0;background:none;width:26px;display:grid;place-items:center;color:var(--tx2);cursor:default;padding:0}
.nav .grp button+button{border-left:.5px solid var(--btn-b)}
.nav .grp svg{width:12px;height:12px;stroke-width:1.9}
.activity{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:300px;height:30px;border-radius:7px;background:var(--plaque-b);border:.5px solid var(--hair2);display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;color:var(--tx2);overflow:hidden}
.activity b{font-weight:500;color:var(--tx)}
.activity .bar{position:absolute;left:0;bottom:0;height:2px;width:30%;background:var(--acc)}

/* контент */
.content{flex:1;position:relative;min-height:0}
.scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.mmap{position:absolute;right:3px;top:8px;bottom:8px;width:6px;pointer-events:none}
.mmap i{position:absolute;left:0;width:6px;border-radius:2px;min-height:3px}
.mmap i.d{background:#e5534b}.mmap i.a{background:var(--acc)}
.mmap .vp{position:absolute;left:-2px;right:-2px;border-radius:3px;background:var(--plaque-b);border:.5px solid var(--hair)}

/* нижняя строка */
.status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--status);border-top:.5px solid var(--hair);font-size:11.5px;color:var(--tx2);white-space:nowrap}
.status .grow{flex:1}
.status .h{display:inline-flex;align-items:center;gap:5px}
.kc{display:inline-grid;place-items:center;min-width:17px;height:16px;padding:0 4px;border-radius:4px;background:var(--btn);border:.5px solid var(--btn-b);box-shadow:0 .5px 0 var(--btn-b);font:500 10.5px var(--mono);color:var(--tx)}
.mode{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:5px;cursor:default}
.mode:hover{background:var(--hover)}
.mode svg{width:10px;height:10px;stroke-width:2}

/* ───────────── Документ ───────────── */
.doc-wrap{padding:30px 48px 140px}
.doc{max-width:660px;margin:0 auto;font:17.5px/1.7 var(--serif);color:var(--tx)}
.basenote{max-width:660px;margin:0 auto 26px;font:12px var(--font);color:var(--tx2);display:flex;align-items:center;gap:6px}
.basenote svg{width:13px;height:13px;color:var(--tx3)}
.doc h1{font-size:34px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em}
.doc h2{font-size:23px;line-height:1.3;font-weight:700;margin:0}
.doc p,.doc ul,.doc table,.doc pre{margin:0}
.doc ul{list-style:none;padding:0}
.doc li{position:relative;padding-left:1.35em;margin:.15em 0}
.doc li::before{content:"";position:absolute;left:.45em;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--tx3)}
.doc code{font:.82em var(--mono);background:var(--plaque);padding:.12em .38em;border-radius:4px}
.doc table{border-collapse:collapse;width:100%;font:14.5px/1.45 var(--font)}
.doc th{text-align:left;font-weight:600;color:var(--tx2);font-size:12.5px}
.doc th,.doc td{padding:7px 10px;border-bottom:.5px solid var(--hair)}
.doc tr:last-child td{border-bottom:0}
.doc th:first-child,.doc td:first-child{padding-left:0}
.doc pre.code{font:13.5px/1.6 var(--mono);padding:12px 16px;border-radius:8px;background:var(--plaque-b);white-space:pre-wrap}
.sg{margin-bottom:1em;position:relative}
.sg.h{margin-top:1.55em;margin-bottom:.45em}
.sg.h1{margin-bottom:.6em}
.sg.tight{margin-bottom:.15em}
.blk{position:relative;margin:0 -14px;padding:4px 14px;border-radius:6px}
.blk+.blk{margin-top:4px}
.blk.del{background:var(--del)}
.blk.add{background:var(--add)}
.blk.add pre.code{background:transparent;padding:4px 2px}
.blk.add table th,.blk.add table td{border-color:rgba(0,60,160,.12)}
html[data-theme=dark] .blk.add table th,html[data-theme=dark] .blk.add table td{border-color:rgba(255,255,255,.1)}
.lab{position:absolute;right:calc(100% + 12px);top:9px;font:500 11px/1 var(--font);white-space:nowrap;letter-spacing:.01em}
.del>.lab{color:var(--red-tx)}
.add>.lab{color:var(--acc-tx)}
mark{color:inherit;border-radius:3px;padding:.1em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.d{background:var(--delw)}
mark.a{background:var(--addw)}

/* две колонки */
.split-wrap{padding:22px 0 140px}
.split{display:grid;grid-template-columns:1fr 1fr;font:16.5px/1.68 var(--serif)}
.split .doc{max-width:none;font:inherit;margin:0}
.c.cap{flex-direction:row;align-items:center;justify-content:flex-start}
.c{display:flex;flex-direction:column;padding:0 40px 14px 40px;min-width:0}
.c.l{border-right:.5px solid var(--hair);padding-right:36px}
.c.r{padding-left:36px}
.c.h{padding-top:1.4em;padding-bottom:6px}
.c.tight{padding-bottom:3px}
.c .blk{margin:0 -12px;padding:4px 12px}
.fill{flex:1;margin:0 -12px;border-radius:6px;background:var(--hatchbg) repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px)}
.c>.blk+.fill{margin-top:0}
.cap{font:12px var(--font);color:var(--tx2);display:flex;align-items:center;gap:6px;padding-top:0;padding-bottom:16px}
.cap svg{width:13px;height:13px;color:var(--tx3)}
.cap b{font-weight:600;color:var(--tx)}
.split .doc h1{font-size:30px}
.split .doc h2{font-size:21px}

/* ───────────── Код ───────────── */
.code-wrap{padding:0 0 140px}
.code1,.code2{display:grid;font:12.5px/20px var(--mono)}
.code1{grid-template-columns:44px 44px 1fr}
.code2{grid-template-columns:44px 1fr 44px 1fr}
.code1 .n,.code2 .n{text-align:right;padding-right:10px;color:var(--tx3);user-select:none;font-size:11.5px}
.code1 .t,.code2 .t{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 16px 0 12px;min-width:0}
.code2 .t.l{border-right:.5px solid var(--hair)}
.t.del{background:var(--del)}
.t.add{background:var(--add)}
.t.x{background:var(--hatchbg) repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px)}
.t .sg-sign{display:none}
.code-cap{display:grid;grid-template-columns:1fr 1fr;font:12px var(--font);color:var(--tx2);border-bottom:.5px solid var(--hair2)}
.code-cap>div{display:flex;align-items:center;gap:6px;padding:12px 16px 10px 56px}
.code-cap>div:first-child{border-right:.5px solid var(--hair)}
.code-cap svg{width:13px;height:13px;color:var(--tx3)}
.code-cap b{font-weight:600;color:var(--tx)}
.code1-cap{display:flex;align-items:center;gap:6px;font:12px var(--font);color:var(--tx2);padding:12px 16px 10px 100px;border-bottom:.5px solid var(--hair2)}
.code1-cap svg{width:13px;height:13px;color:var(--tx3)}
.fold{grid-column:1/-1;display:flex;align-items:center;gap:6px;height:28px;padding-left:56px;background:var(--fold);border-top:.5px solid var(--hair2);border-bottom:.5px solid var(--hair2);font:12px var(--font);color:var(--acc-tx);cursor:default;margin:2px 0}
.fold:hover{background:var(--acc-soft)}
.fold svg{width:11px;height:11px;stroke-width:2}
.fold .r{color:var(--tx3);margin-left:6px}
.code1 .fold{padding-left:100px}
.fr{display:contents}
.fr.hid{display:none}
.top-gap{grid-column:1/-1;height:8px}
.k-kw{color:var(--s-kw);font-weight:600}.k-str{color:var(--s-str)}.k-com{color:var(--s-com);font-style:italic}
.k-num{color:var(--s-num)}.k-typ{color:var(--s-typ)}.k-fn{color:var(--s-fn)}
.code1 mark,.code2 mark{border-radius:2px;padding:1px 0}

/* ───────────── Записка агента ───────────── */
.note-wrap{padding:56px 48px 140px}
.note{max-width:620px;margin:0 auto}
.note .who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2);margin-bottom:22px}
.note .av{width:30px;height:30px;border-radius:8px;background:var(--plaque);display:grid;place-items:center;color:var(--tx2)}
.note .who b{display:block;color:var(--tx);font-size:13px;font-weight:600}
.note h1{font:700 30px/1.2 var(--serif);margin:0 0 18px;letter-spacing:-.01em}
.note p{font:18px/1.72 var(--serif);margin:0 0 1em}
.note code{font:.8em var(--mono);background:var(--plaque);padding:.14em .4em;border-radius:4px}
.note a{color:var(--acc-tx);text-decoration:none}
.note a code{background:var(--acc-soft)}
.note .files{margin-top:28px;border-top:.5px solid var(--hair);padding-top:16px;font-size:12px;color:var(--tx2)}

/* ───────────── Список ревью ───────────── */
.list{font-size:13px}
.lhead,.lrow{display:grid;grid-template-columns:28px minmax(300px,1fr) 150px 170px 210px 220px;align-items:center;padding:0 16px}
.lhead{height:28px;font-size:11.5px;font-weight:600;color:var(--tx2);border-bottom:.5px solid var(--hair);position:sticky;top:0;background:var(--bg)}
.lhead>div{padding:0 10px;border-left:.5px solid var(--hair2);height:14px;display:flex;align-items:center;gap:4px}
.lhead>div:first-child,.lhead>div:nth-child(2){border-left:0}
.lhead svg{width:9px;height:9px;stroke-width:2.2}
.lrow{height:38px;cursor:default}
.lrow:nth-child(even){background:var(--stripe)}
.lrow.real:hover{background:var(--acc-soft)}
.lrow>div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.lrow .t1{font-weight:500}
.lrow .muted{color:var(--tx2)}
.lrow .faint{color:var(--tx3)}
.mini{width:54px;height:3px;border-radius:2px;background:var(--hair);overflow:hidden;flex:none}
.mini>i{display:block;height:100%;background:var(--acc)}
.mini.full>i{background:var(--green)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.pill.acc{color:var(--acc-tx)}
.pill.ok{color:var(--green)}
.pill.ok svg{width:12px;height:12px;stroke-width:2.2}
.ring.gray{border-color:var(--tx3)}
.dot.steady{background:var(--acc)}

/* ───────────── Всплывающее ───────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.menu{position:fixed;z-index:30;width:268px;background:var(--menu);border-radius:10px;box-shadow:var(--pop-sh);padding:5px;font-size:13px}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('import from export function const let for of if return await new null true false else'.split(' '));
const TY = new Set('string number boolean void'.split(' '));
const RE = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)/g;
function tokens(line){
  const out=[]; let m; RE.lastIndex=0;
  while((m=RE.exec(line))){
    const s=m.index, e=s+m[0].length; let c=null;
    if(m[1]) c='com'; else if(m[2]) c='str'; else if(m[3]) c='num';
    else if(m[4]){ const w=m[4];
      if(KW.has(w)) c='kw'; else if(TY.has(w)) c='typ';
      else if(/^[A-Z]/.test(w)) c='typ';
      else if(/^\s*\(/.test(line.slice(e)) && line[s-1]!=='.' ) c='fn';
      else if(/^\s*\(/.test(line.slice(e))) c='fn';
    }
    if(c) out.push({s,e,c});
  }
  return out;
}
/* «⟦…⟧» в строке — изменённый кусок */
function code(src, kind){
  let plain='', ranges=[], st=null;
  for(const ch of src){
    if(ch==='⟦'){st=plain.length;continue}
    if(ch==='⟧'){ranges.push([st,plain.length]);continue}
    plain+=ch;
  }
  const toks=tokens(plain);
  const cuts=new Set([0,plain.length]);
  toks.forEach(t=>{cuts.add(t.s);cuts.add(t.e)});
  ranges.forEach(r=>{cuts.add(r[0]);cuts.add(r[1])});
  const pts=[...cuts].sort((a,b)=>a-b);
  let html='', inM=false;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1]; if(a===b) continue;
    const m=ranges.some(r=>a>=r[0]&&b<=r[1]);
    if(m&&!inM){html+=`<mark class="${kind==='del'?'d':'a'}">`;inM=true}
    if(!m&&inM){html+='</mark>';inM=false}
    const t=toks.find(t=>a>=t.s&&b<=t.e);
    const txt=esc(plain.slice(a,b));
    html+= t?`<span class="k-${t.c}">${txt}</span>`:txt;
  }
  if(inM) html+='</mark>';
  return html||' ';
}

const LBL = {repl:['было','стало'], mod:['было','стало'], ins:[null,'стало'], add:[null,'новое'], del:['удалено',null]};
function docOne(){

function docTwo(){
  const cells = WEB.map(s=>{

/* ═════════════ Код ═════════════ */
let foldN=0;
function codeTwo(rows){
  let h='';
  for(const r of rows){
    const [k]=r;
    if(k==='fold'){
      const id=++foldN, [_,b0,c0,lines]=r;
      h+=`<div class="fold" data-fold="${id}">${ic('chevD')}Ещё ${lines.length} ${plural(lines.length)}<span class="r">${b0}–${b0+lines.length-1}</span></div>`;
      h+=lines.map((t,i)=>`<div class="fr hid" data-f="${id}"><div class="n">${b0+i}</div><div class="t l">${code(t)}</div><div class="n">${c0+i}</div><div class="t">${code(t)}</div></div>`).join('');
      continue;
    }
    const [,bn,bt,cn,ct=bt]=r;
    if(k==='same') h+=`<div class="n">${bn}</div><div class="t l">${code(bt)}</div><div class="n">${cn}</div><div class="t">${code(ct)}</div>`;
    if(k==='mod') h+=`<div class="n">${bn}</div><div class="t l del" data-mm="d">${code(bt,'del')}</div><div class="n">${cn}</div><div class="t add" data-mm="a">${code(ct,'add')}</div>`;
    if(k==='add') h+=`<div class="n"></div><div class="t l x"></div><div class="n">${cn}</div><div class="t add" data-mm="a">${code(ct,'add')}</div>`;
  }
  return `<div class="code-wrap"><div class="code-cap"><div>${ic('clock')}<span><b>База</b> · до задачи · из git, HEAD</span></div><div><span><b>Текущая</b> · прислал агент сегодня в 14:20</span></div></div><div class="code2"><div class="top-gap"></div>${h}</div></div>`;
}
function codeOne(rows){
  let h='', dels=[], adds=[];
  const flush=()=>{
    h+=dels.map(([n,t])=>`<div class="n">${n}</div><div class="n"></div><div class="t del" data-mm="d">${code(t,'del')}</div>`).join('');
    h+=adds.map(([n,t])=>`<div class="n"></div><div class="n">${n}</div><div class="t add" data-mm="a">${code(t,'add')}</div>`).join('');
    dels=[];adds=[];
  };
  for(const r of rows){
    const [k]=r;
    if(k==='mod'){dels.push([r[1],r[2]]);adds.push([r[3],r[4]]);continue}
    if(k==='add'){adds.push([r[3],r[4]]);continue}
    flush();
    if(k==='fold'){
      const id=++foldN, [_,b0,c0,lines]=r;
      h+=`<div class="fold" data-fold="${id}">${ic('chevD')}Ещё ${lines.length} ${plural(lines.length)}</div>`;
      h+=lines.map((t,i)=>`<div class="fr hid" data-f="${id}"><div class="n">${b0+i}</div><div class="n">${c0+i}</div><div class="t">${code(t)}</div></div>`).join('');
      continue;
    }
    const [,bn,bt,cn,ct=bt]=r;
    h+=`<div class="n">${bn}</div><div class="n">${cn}</div><div class="t">${code(ct)}</div>`;
  }
  flush();
  return `<div class="code-wrap"><div class="code1-cap">${ic('clock')}<span>Отличия от версии «до задачи» · из git, HEAD</span></div><div class="code1"><div class="top-gap"></div>${h}</div></div>`;
}
function plural(n){const a=n%10,b=n%100;if(a===1&&b!==11)return'строка';if(a>=2&&a<=4&&(b<12||b>14))return'строки';return'строк'}

/* ═════════════ Отрисовка ═════════════ */
function render(){
  foldN=0;
  const s=S.screen, app=document.getElementById('app'), layer=document.getElementById('layer');
  document.documentElement.dataset.theme=S.theme;
  layer.innerHTML='';
  if(s===1) app.innerHTML=listScreen();
  else if(s===2||s===6||s===9||s===10) app.innerHTML=reviewScreen({file:'web',cols:1,menuOpen:s===6});
  else if(s===3) app.innerHTML=reviewScreen({file:'web',cols:2});
  else if(s===4) app.innerHTML=reviewScreen({file:'tree',cols:2});
  else if(s===5) app.innerHTML=reviewScreen({file:'tree',cols:1});
  else if(s===7) app.innerHTML=reviewScreen({file:'note'});
  else if(s===8) app.innerHTML=reviewScreen({file:'app',cols:1});
  if(s===6){ layer.innerHTML=menuLayer(); place('menu','more-btn','right'); }
  if(s===8){ layer.innerHTML=popLayer(); place('pop','accept-btn','arrow'); }
  if(s===9){ document.getElementById('win').classList.add('off'); layer.innerHTML=offlineLayer(); }
  if(s===10){ layer.innerHTML=keysLayer(); }
  const sc=document.getElementById('scroll'); if(sc&&S.y){ sc.scrollTop=S.y; }
  minimap();
  svc();
  bind();
}
function place(id, anchor, how){
  const el=document.getElementById(id), a=document.getElementById(anchor); if(!el||!a) return;
  const r=a.getBoundingClientRect();
  el.style.top=(r.bottom+(how==='arrow'?12:5))+'px';
  if(how==='right'){ el.style.left=Math.min(r.left, innerWidth-el.offsetWidth-8)+'px'; if(r.left+el.offsetWidth>innerWidth-8) el.style.left=(r.right-el.offsetWidth)+'px'; }
  else { const left=Math.min(r.left+r.width/2-el.offsetWidth+44, innerWidth-el.offsetWidth-10); el.style.left=left+'px'; el.style.setProperty('--arrow', (left+el.offsetWidth-(r.left+r.width/2)-7)+'px'); }
}
function minimap(){
  const sc=document.getElementById('scroll'), mm=document.getElementById('mmap'); if(!sc||!mm) return;
  const H=sc.scrollHeight, h=mm.clientHeight; if(!H) return;
  let html='';
  const st=sc.getBoundingClientRect().top - sc.scrollTop;
  sc.querySelectorAll('[data-mm]').forEach(e=>{
    const r=e.getBoundingClientRect(); const top=(r.top-st)/H*h, hh=Math.max(3,r.height/H*h);
    html+=`<i class="${e.dataset.mm}" style="top:${top.toFixed(1)}px;height:${hh.toFixed(1)}px"></i>`;
  });
  const vp = `<div class="vp" style="top:${(sc.scrollTop/H*h).toFixed(1)}px;height:${Math.min(h,sc.clientHeight/H*h).toFixed(1)}px"></div>`;
  mm.innerHTML = (H>sc.clientHeight+4?vp:'')+html;
}
function svc(){
  const box=document.getElementById('svc');
  box.style.display=S.panel?'':'none';
  document.getElementById('svc-s').innerHTML=Array.from({length:10},(_,i)=>`<button data-s="${i+1}" class="${S.screen===i+1?'on':''}" title="${SCREEN_NAMES[i]}">${i+1}</button>`).join('');
  document.getElementById('svc-t').textContent=S.theme==='dark'?'тёмная':'светлая';
}
const SCREEN_NAMES=['Список ревью','Документ, одна колонка','Документ, две колонки','Код, две колонки','Код, одна колонка','Меню ␣','Записка агента','Принять нельзя','duet не запущен','Список клавиш'];
function go(s){ S.screen=+s; S.y=0; writeHash(); render(); }
function writeHash(){ history.replaceState(null,'',`#s=${S.screen}&t=${S.theme}${S.panel?'':'&p=0'}`); }
function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  const s=+p.get('s'); if(s>=1&&s<=10) S.screen=s;
  const t=p.get('t'); if(t==='light'||t==='dark'){ S.theme=t; }
  else S.theme = matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  if(p.get('p')==='0') S.panel=false;
  S.y=+p.get('y')||0;
}
let colsPref=1;
function bind(){
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=ev=>{ev.preventDefault();ev.stopPropagation();go(e.dataset.go)});
  document.querySelectorAll('[data-file]').forEach(e=>e.onclick=ev=>{ev.preventDefault();
    const f=e.dataset.file;
    if(f==='web') go(colsPref===2?3:2); else if(f==='tree') go(colsPref===2?4:5); else go(f);
  });
  document.querySelectorAll('[data-dir]').forEach(e=>e.onclick=()=>e.parentElement.classList.toggle('closed'));
  document.querySelectorAll('.row.sel[data-file]').forEach(e=>e.onclick=()=>{S.closedBlocks=!S.closedBlocks;const b=e.nextElementSibling;if(b&&b.classList.contains('blocks'))b.classList.toggle('closed')});
  document.querySelectorAll('[data-fold]').forEach(e=>e.onclick=()=>{document.querySelectorAll(`[data-f="${e.dataset.fold}"]`).forEach(x=>x.classList.remove('hid'));e.remove();minimap()});
  document.querySelectorAll('[data-tm]').forEach(e=>e.onclick=()=>{S.themeMode=e.dataset.tm;S.theme=e.dataset.tm==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):e.dataset.tm;writeHash();render()});
  document.querySelectorAll('[data-lang]').forEach(e=>e.onclick=()=>{S.lang=e.dataset.lang;render()});
  document.querySelectorAll('.blk-row').forEach((e,i)=>e.onclick=()=>{const t=document.getElementById('b'+(i+1));if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});
  const sc=document.getElementById('scroll'); if(sc) sc.onscroll=minimap;
  if(S.screen===8) document.querySelectorAll('#pop .btn').forEach(b=>b.onclick=()=>go(2));
}
document.getElementById('svc').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.s) go(b.dataset.s);
  if(b.id==='svc-t'){ S.theme=S.theme==='dark'?'light':'dark'; S.themeMode=S.theme; writeHash(); render(); }
  if(b.id==='svc-m'){ document.getElementById('svc').classList.toggle('min'); b.textContent=document.getElementById('svc').classList.contains('min')?'+':'–'; }
});
let pending='';
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key, s=S.screen;
  if(k==='Escape'){ if([6,8,10].includes(s)) go(2); return; }
  if(k===' '){ e.preventDefault(); if(s===2) go(6); else if(s===6) go(2); return; }
  if(s===6){ if(k==='a') go(8); if(k==='v'){colsPref=2;go(3)} if(k==='Escape') go(2); return; }
  if(k==='?'){ go(10); return; }
  if(k==='v'){ const m={2:3,3:2,4:5,5:4}; if(m[s]){ colsPref=(s===2||s===5)?2:1; go(m[s]); } return; }
  const sc=document.getElementById('scroll'); if(!sc) return;
  if(k==='j'||k==='ArrowDown'){ e.preventDefault(); sc.scrollBy({top:70}); }
  if(k==='k'||k==='ArrowUp'){ e.preventDefault(); sc.scrollBy({top:-70}); }
  if(k==='G') sc.scrollTo({top:sc.scrollHeight});
  if(k==='g'){ if(pending==='g'){ sc.scrollTo({top:0}); pending=''; } else { pending='g'; setTimeout(()=>pending='',600); } }
});
addEventListener('hashchange',()=>{readHash();render()});
addEventListener('resize',()=>render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{ if(S.themeMode==='auto'){ S.theme=e.matches?'dark':'light'; render(); } });
readHash();
render();
</script>
</body>
</html>
