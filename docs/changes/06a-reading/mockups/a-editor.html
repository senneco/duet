<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>duet — A · Редактор</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
body.light{
  --bg:#faf9f7; --panel:#f3f1ed; --line:#e3dfd8; --line2:#ebe8e2; --hover:rgba(40,30,10,.04);
  --text:#1d1b18; --text2:#4f4a43; --muted:#8a847a; --lnc:#b0aa9f;
  --accent:#7b6cf6; --accent-t:#5b4bd8; --accent-bg:rgba(123,108,246,.10); --accent-b:rgba(123,108,246,.42);
  --sel:rgba(123,108,246,.09); --blue:#3f74e0; --warn:#a96a12;
  --del-b:#fce9e8; --del-w:#f6c3c3; --del-s:#c0444e;
  --add-b:#e7eefb; --add-w:#c0d3f6; --add-s:#3a6bd0;
  --hatch:rgba(60,45,20,.13); --kbd:#fff; --plate:rgba(60,45,20,.06); --fold:#f2f0eb; --vp:rgba(40,30,10,.06);
  --tk:#8a3fb8; --ts:#a2541a; --tc:#8f897e; --tn:#b0451f; --tt:#946500; --tf:#1e6a72;
  --scrim:rgba(30,25,15,.18); --pop:#fff; --shadow:0 10px 30px rgba(40,30,10,.14),0 1px 3px rgba(40,30,10,.10);
}
body.dark{
  --bg:#17151f; --panel:#1c1a26; --line:#2d2a3b; --line2:#252231; --hover:rgba(255,255,255,.035);
  --text:#e7e4ef; --text2:#b9b3c9; --muted:#7f7995; --lnc:#5d5872;
  --accent:#8b7ef8; --accent-t:#a99ffb; --accent-bg:rgba(139,126,248,.14); --accent-b:rgba(139,126,248,.45);
  --sel:rgba(139,126,248,.13); --blue:#6d9cf5; --warn:#e0a84f;
  --del-b:#4a2228; --del-w:#7a3540; --del-s:#f08a93;
  --add-b:#263a50; --add-w:#3d4f8a; --add-s:#8db4ff;
  --hatch:rgba(255,255,255,.075); --kbd:#24212f; --plate:rgba(255,255,255,.07); --fold:#1d1b28; --vp:rgba(255,255,255,.06);
  --tk:#c7a0f7; --ts:#e6b47c; --tc:#8a84a0; --tn:#f39b78; --tt:#e8c674; --tf:#7fd3c8;
  --scrim:rgba(5,4,10,.45); --pop:#211f2d; --shadow:0 12px 36px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit}

/* ---------- каркас ---------- */
#app{display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 24px;height:100vh}
#app.full{grid-template-columns:minmax(0,1fr)}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.status{grid-column:1/-1;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:16px;padding:0 12px;font:11px/23px var(--mono);color:var(--muted);white-space:nowrap}
.status .sp{flex:1}
.status kbd{margin-right:5px}
.sw{cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sw b{color:var(--text);font-weight:600}
.sw:hover{color:var(--text2)}

/* ---------- боковая панель ---------- */
.sb-head{padding:11px 14px 12px;border-bottom:1px solid var(--line2)}
.crumb{font:11px var(--mono);color:var(--muted);cursor:pointer;display:inline-flex;gap:6px}
.crumb:hover{color:var(--accent-t)}
.rv-title{font-weight:600;font-size:13.5px;line-height:1.35;margin:7px 0 9px;color:var(--text);letter-spacing:-.005em}
.agent{display:flex;align-items:center;gap:7px;font:11.5px var(--mono);color:var(--text2)}
.agent .k{color:var(--muted)}
.prog{margin-top:7px;display:flex;align-items:center;gap:10px;font:11.5px var(--mono);color:var(--text2);white-space:nowrap}
.bar{flex:1;height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.sync{margin-top:9px;font:11px var(--mono);color:var(--muted);display:flex;gap:10px;align-items:center}
.sync .bar i{background:var(--blue);animation:syncgrow 6s linear infinite}
@keyframes syncgrow{from{width:30%}to{width:34%}}

.tree{padding:6px 0 200px}
.troot{font:11px var(--mono);color:var(--muted);padding:6px 14px 4px}
.tr{display:flex;align-items:center;height:24px;padding-right:12px;position:relative;font:12.5px var(--mono);color:var(--text);cursor:pointer;white-space:nowrap}
.tr:hover{background:var(--hover)}
.tr.open{background:var(--sel)}
.tr.open::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.tr .ic{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;flex:none;position:relative}
.tr .nm{flex:1;min-width:0}
.tr .meta{font-size:10.5px;color:var(--muted);margin-left:8px;display:inline-flex;align-items:center}
.tr.dir{color:var(--text2)}
.tr.dir .ic{color:var(--muted);font-size:9px}
.tr.tnote{font-family:var(--sans);font-size:12.5px;color:var(--text)}
.tr.tnote .ic{color:var(--accent-t);font:12px var(--mono)}
.tr.gone .nm{color:var(--muted)}
.tr.tblk{height:23px;font-family:var(--sans);font-size:12.5px;color:var(--text2)}
.tr.tblk .ic{font:13px var(--mono);color:var(--muted)}
.tr.tblk.imp1 .ic{color:var(--accent-t)}
.tr.tblk.cur{color:var(--text)}
.meta.warn{color:var(--warn)}

/* значки */
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);position:relative;display:block}
.dot.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.22}}
.ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--blue);position:relative;display:block}
.dot.grey{background:var(--muted);opacity:.55}
.ripple::before,.ripple::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:1.5px solid var(--blue);box-sizing:border-box;animation:rip 2.2s ease-out infinite}
.ripple::after{animation-delay:1.1s}
@keyframes rip{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.2);opacity:0}}
.ck{width:12px;height:12px;display:block}
.ck path{stroke:var(--accent);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dots{display:inline-flex;gap:2.5px;align-items:center;height:10px}
.dots i{width:3px;height:3px;border-radius:50%;background:var(--accent);animation:hop 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(1px);opacity:.35}30%{transform:translateY(-2px);opacity:1}}

/* ---------- верхняя панель файла ---------- */
.top{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 20px;border-bottom:1px solid var(--line);white-space:nowrap}
.path{font:12.5px var(--mono);color:var(--muted)}
.path b{color:var(--text);font-weight:600}
.tag{font:11px var(--mono);color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 5px 0 10px;border:1px solid var(--line);border-radius:5px;font:12.5px var(--sans);color:var(--text);background:transparent;cursor:pointer;position:relative}
.btn:hover{background:var(--hover)}
.btn.pri{border-color:var(--accent-b);color:var(--accent-t);background:var(--accent-bg);font-weight:500}
kbd{font:10.5px/1 var(--mono);padding:2px 4px;border-radius:3px;background:var(--kbd);color:var(--text2);border:1px solid var(--line);display:inline-block}
.btn.pri kbd{border-color:var(--accent-b);background:transparent;color:var(--accent-t)}

/* ---------- область чтения ---------- */
.wrap{flex:1;min-height:0;position:relative;display:flex}
.scroll{flex:1;overflow:auto;position:relative;margin-right:12px}
.map{position:absolute;right:0;top:0;bottom:0;width:12px;border-left:1px solid var(--line2)}
.map i{position:absolute;left:2px;right:2px;min-height:2px;border-radius:1px}
.map i.d{background:var(--del-s);opacity:.75;right:6px}
.map i.a{background:var(--add-s);opacity:.75;left:6px}
.map .vp{position:absolute;left:0;right:0;background:var(--vp);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.basehead{font:11px var(--mono);color:var(--muted);margin:0 0 22px;display:flex;gap:8px;align-items:center}
.basehead b{color:var(--text2);font-weight:500}

/* документ */
.doc{max-width:780px;margin:0 auto;padding:30px 64px 200px;font:16px/27px var(--sans);color:var(--text)}
.blk{margin-top:12px}
.blk.t-h1{margin-top:0}
.blk.t-h2{margin-top:30px}
.blk.t-li{margin-top:3px}
.blk.t-table,.blk.t-pre{margin-top:14px}
.blk.after-h{margin-top:8px}
.blk h1{font-size:28px;line-height:36px;margin:0;font-weight:650;letter-spacing:-.018em}
.blk h2{font-size:19.5px;line-height:27px;margin:0;font-weight:620;letter-spacing:-.008em;display:flex;align-items:baseline;gap:10px}
.blk h2 .bm{font:13px var(--mono);color:var(--muted);font-weight:400;letter-spacing:0}
.blk h2 .bm.b1{color:var(--accent-t)}
.blk p{margin:0}
.blk ul{margin:0;padding-left:22px}
.blk li{padding-left:2px}
.blk li::marker{color:var(--muted)}
.blk code{font:13.5px var(--mono);background:var(--plate);padding:1px 4px;border-radius:3px}
.side-o,.side-n,.eqb{position:relative;padding:3px 0}
.doc .side-o,.doc .side-n{padding:3px 16px;margin:0 -16px}
.side-o{background:var(--del-b)}
.side-n{background:var(--add-b)}
.sg{position:absolute;left:-30px;top:3px;width:14px;text-align:center;font:600 13px/27px var(--mono)}
.side-o .sg{color:var(--del-s)}
.side-n .sg{color:var(--add-s)}
.wd,.wa{border-radius:2px;padding:1px 0}
.wd{background:var(--del-w)}
.wa{background:var(--add-w)}
table.t{border-collapse:collapse;font-size:14px;line-height:22px;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
table.t th{font-weight:600;font-size:13px;color:var(--text2)}
.side-n table.t th,.side-n table.t td{border-color:rgba(58,107,208,.22)}
body.dark .side-n table.t th,body.dark .side-n table.t td{border-color:rgba(141,180,255,.18)}
pre.cb{margin:0;font:13px/20px var(--mono);background:var(--plate);padding:10px 12px;border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}

/* две колонки */
.doc2{padding:0 0 200px;font:15px/25px var(--sans);min-height:100%;background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat}
.colhead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-bottom:1px solid var(--line);font:11px/30px var(--mono);color:var(--muted)}
.colhead>div{padding:0 32px;display:flex;gap:8px}
.colhead>div+div{border-left:1px solid var(--line)}
.colhead b{color:var(--text2);font-weight:500}
.doc2 .inner{padding-top:26px}
.blk.two{display:grid;grid-template-columns:1fr 1fr}
.blk.two>.c{padding:3px 32px;min-width:0;position:relative}
.blk.two>.c+.c{box-shadow:inset 1px 0 var(--line)}
.blk.two .sg{left:9px;top:3px;line-height:25px}
.blk.two h2 .sg{line-height:25px}
.doc2 .blk h1{font-size:26px;line-height:34px}
.doc2 .blk h2{font-size:18px;line-height:25px}
.doc2 table.t{font-size:13.5px}
.hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 7px)}

/* код */
.code{font:12.5px/20px var(--mono);padding:14px 0 200px}
.code.two{padding-top:0}
.code .colhead{margin-bottom:10px}
.cr{display:grid;grid-template-columns:44px 44px 22px minmax(0,1fr)}
.code.two .cr,.code.two .colhead{grid-template-columns:46px 22px minmax(0,1fr) 46px 22px minmax(0,1fr)}
.code.two .colhead>div:first-child{grid-column:1/4}
.code.two .colhead>div:last-child{grid-column:4/7}
.code.two .colhead>div{padding:0 0 0 14px}
.ln{color:var(--lnc);text-align:right;padding-right:6px;user-select:none}
.cs{text-align:center;font-weight:600}
.cd{white-space:pre-wrap;overflow-wrap:anywhere;padding-right:20px;min-width:0;padding-left:4ch;text-indent:-4ch}
.cs.del,.cd.del{background:var(--del-b)}
.cs.add,.cd.add{background:var(--add-b)}
.cs.del{color:var(--del-s)}.cs.add{color:var(--add-s)}
.code.two .cr>.ln:nth-child(4){box-shadow:inset 1px 0 var(--line)}
.code.two .hatch{grid-column:span 2}
.fold{display:flex;align-items:center;gap:12px;height:28px;margin:4px 0;background:var(--fold);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);color:var(--muted);font:11.5px var(--mono);padding-left:66px;cursor:pointer}
.code.two .fold{padding-left:68px}
.fold:hover{color:var(--accent-t)}
.fold .fh{color:var(--lnc)}
.fold .ex{font-size:12px}
.tk{color:var(--tk)}.ts{color:var(--ts)}.tc{color:var(--tc);font-style:italic}.tn{color:var(--tn)}.tt{color:var(--tt)}.tf{color:var(--tf)}

/* записка */
.note{max-width:700px;margin:0 auto;padding:40px 64px 200px;font:17px/29px var(--sans)}
.note .who{font:11.5px var(--mono);color:var(--muted);margin-bottom:14px;display:flex;gap:10px}
.note h1{font-size:26px;line-height:34px;margin:0 0 16px;font-weight:650;letter-spacing:-.015em}
.note p{margin:0 0 14px}
.fl{font:14.5px var(--mono);background:var(--plate);padding:1px 5px;border-radius:3px;color:var(--accent-t);cursor:pointer;text-decoration:none}
.fl:hover{background:var(--accent-bg)}
.note .next{margin-top:30px;padding-top:14px;border-top:1px solid var(--line2);font:11.5px var(--mono);color:var(--muted)}

/* ---------- список ревью ---------- */
.logo{font:600 13px var(--mono);color:var(--text)}
.list{max-width:1180px;margin:0 auto;padding:30px 32px 120px}
.list h1{font-size:20px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
.list .sub{font:11.5px var(--mono);color:var(--muted);margin-bottom:22px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 124px 128px 190px 196px;align-items:center;gap:16px;min-height:46px;padding-block:8px;padding:0 14px;border-bottom:1px solid var(--line2);position:relative;cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow.cur{background:var(--sel)}
.lrow.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.lhead{min-height:30px;padding-block:0;font:11px var(--mono);color:var(--muted);cursor:default;border-bottom:1px solid var(--line)}
.lhead:hover{background:none}
.lt{font-size:14px;font-weight:500;line-height:1.35}
.lc{font:12px var(--mono);color:var(--text2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.lc.m{color:var(--muted)}
.mini{width:56px;height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.lc .ic{width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center;position:relative}

/* ---------- всплывающее ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.pop{position:absolute;z-index:6;background:var(--pop);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.menu{left:50%;bottom:22px;transform:translateX(-50%);width:380px;padding:6px 0}
.menu .mh{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);padding:6px 14px 8px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.mi{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;height:30px;padding:0 14px;font-size:13px;cursor:pointer}
.mi:hover,.mi.cur{background:var(--sel)}
.mi .key{font:600 12.5px var(--mono);color:var(--accent-t);text-align:center;border:1px solid var(--accent-b);border-radius:4px;line-height:20px}
.mi .val{font:11px var(--mono);color:var(--muted)}
.mi.later{color:var(--muted);cursor:default}
.mi.later:hover{background:none}
.mi.later .key{color:var(--muted);border-color:var(--line)}
.msep{font:10.5px var(--mono);color:var(--muted);padding:8px 14px 3px;border-top:1px solid var(--line2);margin-top:4px}

.deny{right:12px;top:46px;width:340px;padding:14px 16px 14px}
.deny::before{content:"";position:absolute;top:-6px;right:60px;width:10px;height:10px;background:var(--pop);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.deny .dt{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.deny .dd{color:var(--text2);margin:5px 0 12px;font-size:13px;line-height:1.5}
.deny .row{display:flex;gap:8px;align-items:center}
.deny .muted{font:11px var(--mono);color:var(--muted);margin-left:auto}

.down{left:50%;top:70px;transform:translateX(-50%);width:420px;padding:18px 20px}
.down .dt{font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.down .dd{color:var(--text2);margin:8px 0 14px;font-size:13.5px;line-height:1.55}
.down .cmd{font:12.5px var(--mono);background:var(--plate);padding:6px 10px;border-radius:4px;color:var(--text)}
.down .try{margin-top:14px;font:11px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.spin{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.offline .side,.offline .wrap,.offline .top{filter:grayscale(1);opacity:.5}
.offline .dot.blink,.offline .ripple::before,.offline .ripple::after,.offline .dots i{animation:none}
.redot{width:7px;height:7px;border-radius:50%;background:var(--del-s);display:inline-block}
.grdot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;opacity:.8}

.keys{left:50%;top:50%;transform:translate(-50%,-50%);width:820px;padding:0}
.keys .kh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line2)}
.keys .kh b{font-size:14px}
.keys .kh span{font:11px var(--mono);color:var(--muted)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;padding:10px 18px 16px}
.kgr h4{margin:10px 0 4px;font:11px var(--mono);color:var(--muted);font-weight:400}
.kl{display:grid;grid-template-columns:84px 1fr;align-items:center;min-height:26px;font-size:13px;line-height:1.35}
.kl .kk{display:flex;gap:4px}
.kgr.later .kl{color:var(--muted)}
.kgr.later kbd{color:var(--muted)}

/* ---------- служебная панель макета ---------- */
#svc{position:fixed;left:8px;bottom:32px;width:272px;z-index:50;background:#101012;color:#d8d8dc;border:1px dashed #5a5a66;border-radius:6px;padding:9px 10px 10px;font:11px/1.45 var(--sans)}
#svc .h{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--mono);color:#ffd36b}
#svc .h button{background:none;border:0;color:#999;cursor:pointer;font:12px var(--mono);padding:0 2px}
#svc .d{margin:5px 0 8px;color:#b8b8c0}
#svc .n{display:flex;flex-wrap:wrap;gap:3px}
#svc .n a,#svc .t a{font:11px/20px var(--mono);min-width:22px;text-align:center;border:1px solid #3a3a44;border-radius:3px;color:#cfcfd6;cursor:pointer;padding:0 4px}
#svc .n a.on,#svc .t a.on{background:#ffd36b;color:#111;border-color:#ffd36b}
#svc .t{display:flex;gap:3px;margin-top:6px;align-items:center}
#svc .t span{color:#888;font:10.5px var(--mono);margin-left:auto}
#svc.min .d,#svc.min .n,#svc.min .t{display:none}
</style>

<script>
/* ===================== состояние ===================== */
const S = { s: 2, t: 'light', exp: new Set(), blkOpen: true, lang: 'ru' };
const SCREENS = ['','Список ревью','Документ, одна колонка','Документ, две колонки','Код, две колонки','Код, одна колонка','Меню ␣','Записка агента','Принять нельзя','duet не запущен','Список клавиш'];
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const s = parseInt(h.get('s'),10);
  S.s = s>=1 && s<=10 ? s : 2;
  S.t = h.get('t')==='dark' ? 'dark' : 'light';
}
function go(s,t){ location.hash = `s=${s??S.s}&t=${t??S.t}`; }
const esc = x => String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===================== подсветка синтаксиса ===================== */
const KW = new Set('import from export function const let for of if else return async await new'.split(' '));
const TY = new Set('string number boolean void'.split(' '));
function tokclass(s){
  const a = new Array(s.length).fill('');
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(\b\d+\b)|([A-Za-z_$][\w$]*)/g; let m;
  while((m = re.exec(s))){
    let c = '';
    if(m[1]) c='tc'; else if(m[2]) c='ts'; else if(m[3]) c='tn';
    else { const w=m[4];
      if(KW.has(w)) c='tk';
      else if(TY.has(w) || /^[A-Z]/.test(w)) c='tt';
      else if(s[re.lastIndex]==='(') c='tf'; }
    for(let i=m.index;i<re.lastIndex;i++) a[i]=c;
  }
  return a;
}
/* text + отмеченные куски → html; подсветка слова — одна цельная подложка поверх токенов */
function hl(text, marks, cls){
  const n = text.length, ch = new Uint8Array(n); let from = 0;
  for(const m of marks||[]){ const i = text.indexOf(m, from); if(i<0) continue; ch.fill(1, i, i+m.length); from = i+m.length; }
  const tk = tokclass(text); let out='', i=0;
  while(i<n){
    const c = ch[i]; let j=i; while(j<n && ch[j]===c) j++;
    let inner='', k=i;
    while(k<j){ let l=k; while(l<j && tk[l]===tk[k]) l++; const t=esc(text.slice(k,l)); inner += tk[k] ? `<span class="${tk[k]}">${t}</span>` : t; k=l; }
    out += c ? `<span class="${cls}">${inner}</span>` : inner; i=j;
  }
  return out || '&#8203;';
}

/* ===================== данные: web.md ===================== */
const D = s => `<span class="wd">${s}</span>`, A = s => `<span class="wa">${s}</span>`;
const TABLE = `<table class="t"><tr><th>Пометка</th><th>Когда</th></tr><tr><td>работает</td><td>у агента есть комментарии «в работе»</td></tr><tr><td>ответ</td><td>есть непросмотренный ответ</td></tr></table>`;
const CB = `<pre class="cb">${hl('const theme = localStorage.getItem("theme") ?? "system";')}</pre>`;
const DOC = [

  {k:'eq', t:'h2', h:'Список ревью', bm:'⇈', b:1},

  {k:'ch', t:'table', o:null, n:TABLE},

  {k:'eq', t:'li', h:'Принятый файл отмечен галочкой.'},

function inner(t, h, bm, b){
  if(t==='h1') return `<h1>${h}</h1>`;

  if(t==='li') return `<ul>${(Array.isArray(h)?h:[h]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return h;
}
function docHTML(two){
  let out='';
  for(const r of DOC){
    const cls = `blk t-${r.t}${r.ah?' after-h':''}${two?' two':''}`;
    if(!two){

      else out += `<div class="${cls}">`
        + (r.o!=null ? `<div class="side-o" data-m="d"><span class="sg">−</span>${inner(r.t,r.o)}</div>` : '')
        + (r.n!=null ? `<div class="side-n" data-m="a"><span class="sg">+</span>${inner(r.t,r.n,r.bm,r.b)}</div>` : '')
        + `</div>`;
    } else {
      if(r.k==='eq') out += `<div class="${cls}"><div class="c">${inner(r.t,r.h)}</div><div class="c">${inner(r.t,r.h,r.bm,r.b)}</div></div>`;
      else out += `<div class="${cls}">`
        + (r.o!=null ? `<div class="c side-o" data-m="d"><span class="sg">−</span>${inner(r.t,r.o)}</div>` : `<div class="c hatch"></div>`)
        + (r.n!=null ? `<div class="c side-n" data-m="a"><span class="sg">+</span>${inner(r.t,r.n,r.bm,r.b)}</div>` : `<div class="c hatch"></div>`)
        + `</div>`;
    }
  }
  return out;
}

/* ===================== данные: tree.ts ===================== */
const CODE = [

  ['e',''],
  ['m','// Плоский список файлов ревью.','// Дерево файлов ревью: папки по алфавиту, сворачиваются.',['Плоский список','.'],['Дерево',': папки по алфавиту, сворачиваются.']],
  ['m','export function renderTree(files: FileView[], root: HTMLElement) {','export function renderTree(files: FileView[], root: HTMLElement, open: string) {',[],[', open: string']],

const plural = n => (n%10===1&&n%100!==11)?'строка':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'строки':'строк';

function codeHTML(data, two){
  let o=1, n=1, out='';
  const row1 = (lo,ln,sg,cls,html)=>`<div class="cr"><span class="ln">${lo}</span><span class="ln">${ln}</span><span class="cs ${cls}">${sg}</span><span class="cd ${cls}" ${cls?`data-m="${cls==='del'?'d':'a'}"`:''}>${html}</span></div>`;
  const side = (num,sg,cls,html)=> html==null ? `<span class="ln"></span><span class="hatch"></span>` : `<span class="ln">${num}</span><span class="cs ${cls}">${sg}</span><span class="cd ${cls}" ${cls?`data-m="${cls==='del'?'d':'a'}"`:''}>${html}</span>`;
  const row2 = (l,r)=>`<div class="cr">${l}${r}</div>`;
  const eq = t => { const h=hl(t); const r = two ? row2(side(o,'','',h),side(n,'','',h)) : row1(o,n,'','',h); o++; n++; return r; };
  data.forEach((r,idx)=>{
    const k=r[0];
    if(k==='e') out += eq(r[1]);
    else if(k==='m'){
      const ho=hl(r[1],r[3],'wd'), hn=hl(r[2],r[4],'wa');
      if(two) out += row2(side(o,'−','del',ho), side(n,'+','add',hn));
      else out += row1(o,'','−','del',ho) + row1('',n,'+','add',hn);
      o++; n++;
    }
    else if(k==='a'){ const h=hl(r[1]); out += two ? row2(side('',null,null,null), side(n,'+','add',h)) : row1('',n,'+','add',h); n++; }
    else if(k==='d'){ const h=hl(r[1]); out += two ? row2(side(o,'−','del',h), side('',null,null,null)) : row1(o,'','−','del',h); o++; }
    else if(k==='f'){
      if(S.exp.has(idx)) { out += `<div class="fold" data-f="${idx}"><span class="ex">▴</span><span>свернуть ${r[1].length} ${plural(r[1].length)}</span></div>`; r[1].forEach(t=> out += eq(t)); }
      else { out += `<div class="fold" data-f="${idx}"><span class="ex">↕</span><span>ещё ${r[1].length} ${plural(r[1].length)}</span><span class="fh">${r[2]}</span></div>`; o+=r[1].length; n+=r[1].length; }
    }
  });
  return out;
}

function sideHTML(open, opts={}){
  const row=(d,ic,nm,meta,cls,act)=>`<div class="tr ${cls||''}" style="padding-left:${12+d*14}px" ${act?`data-go="${act}"`:''}><span class="ic">${ic}</span><span class="nm">${nm}</span>${meta||''}</div>`;

  const webOpen = open==='web';
  let t = '';
  t += row(0,'¶','Записка агента','', 'tnote'+(open==='note'?' open':''), 'note');
  t += `<div class="troot">duet/</div>`;
  t += row(0,'▾','docs/','', 'dir');

  if(webOpen && S.blkOpen){
    t += blk('⇈','Список ревью','imp1',true);
    t += blk('↑','Дерево файлов','imp2');
    t += blk('↓','Тема и язык','imp3');

  t += row(1,IC.new,'roadmap.md','', '');
  t += row(0,'▾','server/','', 'dir');

  t += row(2, open==='app'?IC.seenRip:IC.newRip,'app.ts', `<span class="meta">ответ</span>`, open==='app'?'open':'', 'app');

    <div class="sb-head">
      <span class="crumb" data-go="list">‹ все ревью</span>

    </div>
    <div class="tree">${t}</div>
  </aside>`;
}

    <div class="dt"><span class="ic" style="position:relative;width:12px;display:inline-flex;justify-content:center">${IC.seenRip}</span>Принять нельзя</div>
    <div class="dd">Есть непросмотренный ответ агента. Сначала откройте его — потом файл можно будет принять.</div>
    <div class="row"><button class="btn pri">Открыть ответ <kbd>␣r</kbd></button><span class="muted"><kbd>esc</kbd> закрыть</span></div>
  </div>`;
  return review('app', `<div class="main">${topFile('server/web/','app.ts','typescript')}${readArea(c)}</div>`, 'исходник · одна колонка', pop);
}

function scrMenu(){
  const pop = `<div class="scrim"></div><div class="pop menu">
    <div class="mh"><span>␣ действия · web.md</span><span>esc</span></div>
    <div class="mi cur"><span class="key">a</span><span>Принять файл</span><span class="val">→ roadmap.md</span></div>
    <div class="mi"><span class="key">v</span><span>Одна / две колонки</span><span class="val">сейчас одна</span></div>
    <div class="mi"><span class="key">m</span><span>Документ / исходник</span><span class="val">сейчас документ</span></div>
    <div class="msep">появится позже</div>
    <div class="mi later"><span class="key">c</span><span>Комментарий к файлу</span><span></span></div>
    <div class="mi later"><span class="key">s</span><span>Отправить агенту</span><span></span></div>
    <div class="mi later"><span class="key">r</span><span>Ответ агента</span><span></span></div>
    <div class="mi later"><span class="key">e</span><span>Править</span><span></span></div>
  </div>`;
  return review('web', docMain(false), 'документ · одна колонка', pop);
}

function scrDown(){
  const pop = `<div class="pop down">
    <div class="dt"><span class="redot"></span>duet не запущен</div>
    <div class="dd">Ядро остановлено. Вкладка подключится сама, как только оно снова заработает, и останется на этом месте.</div>
    <div class="cmd">$ duet web</div>
    <div class="try"><span class="spin"></span>пробую подключиться · попытка 4 · через 3 с</div>
  </div>`;
  return `<div class="offline" style="display:contents">` + review('web', docMain(false), 'документ · одна колонка', pop,
    {left:`<span style="display:inline-flex;gap:7px;align-items:center;color:var(--del-s)"><span class="redot"></span>нет связи с ядром</span>`}) + `</div>`;
}

function scrKeys(){
  const kl = (keys, txt) => `<div class="kl"><span class="kk">${keys.map(k=>`<kbd>${k}</kbd>`).join('')}</span><span>${txt}</span></div>`;
  const pop = `<div class="scrim"></div><div class="pop keys">
    <div class="kh"><b>Клавиши</b><span><kbd>esc</kbd> закрыть</span></div>
    <div class="kg">
      <div>
        <div class="kgr"><h4>чтение</h4>${kl(['j','↓'],'вниз')}${kl(['k','↑'],'вверх')}${kl(['gg'],'в начало файла')}${kl(['G'],'в конец файла')}</div>
        <div class="kgr"><h4>переходы</h4>${kl([']c','[c'],'следующее / предыдущее изменение')}${kl([']f','[f'],'следующий / предыдущий непринятый файл')}${kl([']b','[b'],'следующий / предыдущий блок агента')}</div>
      </div>
      <div>
        <div class="kgr"><h4>действия</h4>${kl(['␣'],'меню действий')}${kl(['␣a'],'принять файл и перейти к следующему')}${kl(['␣v'],'одна / две колонки')}${kl(['␣m'],'документ / исходник')}${kl(['?'],'этот список')}${kl(['esc'],'закрыть меню и окна')}</div>
        <div class="kgr later"><h4>появится позже</h4>${kl(['gc'],'комментарий к выделенному')}${kl(['␣c'],'комментарий к файлу')}${kl(['␣s','␣r','␣e'],'отправить · ответ · править')}</div>
      </div>
    </div>
  </div>`;
  return review('web', docMain(false), 'документ · одна колонка', pop);
}

/* ===================== отрисовка ===================== */
const app = document.getElementById('app');
function render(){
  document.body.className = S.t;
  app.className = S.s===1 ? 'full' : '';
  let h;
  switch(S.s){
    case 1: h = scrList(); break;
    case 2: h = review('web', docMain(false), 'документ · одна колонка'); break;
    case 3: h = review('web', docMain(true), 'документ · две колонки'); break;
    case 4: h = review('tree', codeMain(true), 'исходник · две колонки'); break;
    case 5: h = review('tree', codeMain(false), 'исходник · одна колонка'); break;
    case 6: h = scrMenu(); break;
    case 7: h = scrNote(); break;
    case 8: h = scrDeny(); break;
    case 9: h = scrDown(); break;
    case 10: h = scrKeys(); break;
  }
  app.innerHTML = h;
  renderSvc();
  requestAnimationFrame(drawMap);
}
function drawMap(){
  const sc = document.getElementById('sc'), map = document.getElementById('map');
  if(!sc || !map) return;
  const H = sc.scrollHeight, base = sc.getBoundingClientRect().top - sc.scrollTop;
  let m = '';
  sc.querySelectorAll('[data-m]').forEach(el=>{
    const r = el.getBoundingClientRect();
    const top = (r.top - base)/H*100, hh = Math.max(r.height/H*100, .25);
    m += `<i class="${el.dataset.m}" style="top:${top}%;height:${hh}%"></i>`;
  });
  const vp = () => `<span class="vp" style="top:${sc.scrollTop/H*100}%;height:${sc.clientHeight/H*100}%"></span>`;
  map.innerHTML = vp() + m;
  sc.onscroll = () => { const v = map.querySelector('.vp'); v.style.top = sc.scrollTop/H*100+'%'; };
}

/* служебная панель */
function renderSvc(){
  document.getElementById('svcn').innerHTML = SCREENS.slice(1).map((n,i)=>`<a class="${S.s===i+1?'on':''}" title="${n}" data-s="${i+1}">${i+1}</a>`).join('');
  document.getElementById('svct').innerHTML = `<a class="${S.t==='light'?'on':''}" data-t="light">светлая</a><a class="${S.t==='dark'?'on':''}" data-t="dark">тёмная</a><span>${SCREENS[S.s]}</span>`;
}
document.getElementById('svc').addEventListener('click', e=>{
  const a = e.target.closest('a'); if(a){ if(a.dataset.s) go(+a.dataset.s); if(a.dataset.t) go(null,a.dataset.t); }
  if(e.target.id==='svcx'){ const s=document.getElementById('svc'); s.classList.toggle('min'); e.target.textContent = s.classList.contains('min')?'+':'–'; }
});

/* мышь в интерфейсе */
app.addEventListener('click', e=>{
  const f = e.target.closest('.fold');
  if(f){ const i=+f.dataset.f; S.exp.has(i)?S.exp.delete(i):S.exp.add(i); const sc=document.getElementById('sc'), y=sc.scrollTop; render(); document.getElementById('sc').scrollTop=y; return; }
  const act = e.target.closest('[data-act]');
  if(act){
    if(act.dataset.act==='theme') go(null, S.t==='dark'?'light':'dark');
    if(act.dataset.act==='lang'){ S.lang = S.lang==='ru'?'en':'ru'; render(); }
    if(act.dataset.act==='accept') go(8);
    return;
  }
  const g = e.target.closest('[data-go]');
  if(g){
    const to = g.dataset.go;
    if(to==='web' && g.classList.contains('open')){ S.blkOpen=!S.blkOpen; render(); return; }
    const two = S.s===3 || S.s===4;
    go({list:1, web: two?3:2, tree: two?4:5, note:7, app:8}[to]);
  }
});

/* клавиатура (упрощённо) */
let pend = '';
document.addEventListener('keydown', e=>{
  const k = e.key, sc = document.getElementById('sc');
  if(k==='Escape'){ if([6,8,10].includes(S.s)) go(2); return; }
  if(pend===' '){ pend=''; if(k==='a') go(8); else if(k==='v') go({2:3,3:2,4:5,5:4,6:3}[S.s]||S.s); else if(k==='m') go(S.s); e.preventDefault(); return; }
  if(k===' '){ e.preventDefault(); pend=' '; if(S.s>=2&&S.s<=5) go(6); return; }
  if(k==='?') go(10);
  if(k==='j' && sc) sc.scrollTop += 60;
  if(k==='k' && sc) sc.scrollTop -= 60;
});

window.addEventListener('hashchange', ()=>{ readHash(); render(); });
window.addEventListener('resize', ()=>requestAnimationFrame(drawMap));
readHash(); render();
</script>
</body>
</html>
